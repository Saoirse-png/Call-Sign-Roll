<html>
<head>
    <title>Call Sign Roll</title>
</head>
<body>
<h1>Call Sign Generator</h1>
<!-- Generator Functionality -->
<script>
function generateCallSign() {
    const firstNames = ['Evelyn', 'Casey', 'Gael', 'Éibhleann', 'Morgan', 'Finn', 'Eriu', 'Orlaith', 'Cillian', 'Saoirse', 'Róisín', 'Lorcán', 'Caoimhe', 'Síofra', 'Niall', 'Rowan', 'Niamh', 'Seamus', 'Seánán', 'Eoghan', 'Tadhgán', 'Neala', 'Brian', 'Clodagh', 'Eithne', 'Seán', 'Faelwen', 'Maeve', 'Padraig', 'Kai', 'Diarmuid', 'Eamon', 'Luna', 'Ór', 'Colm'];
    const lastNames = ['McCarthy', 'Wild', 'Harper', 'Gallagher', 'Doyle', "O'Asissi", 'Murray', 'Byrne', 'Calendris', 'Tierney', "O'Thuaidh", 'Yeats'];
    const abilities = [
        'Radio Field: Once a week, learn a random callsign and immediately open a call, ignoring normal cooldowns;',
        'Beach Field: Once per week you may immediately arrive at a random coastal tile. Add beach to its name;',
        'Librarian: once per week, choose a tile on the map, learn its name, and write a journal entry as though you had visited it (including viewing all previous journals);',
        'Quantum Doppelganger: Once a week you can take 2 actions in a day. (quantum duplicates will vanish after one full day of existence);',
        'Very loud: Once a week you may ask your ref to post a message in Island Broadcast. This message must be in all caps and contain a maximum of 10 characters (including spaces);',
        'Summon field: Once a week while at your station, you may cause it to experience the effects of Artemis weather;',
        'Foresight: Once per week you may learn what the weather will be in your current tile 2 days in the future;'
    ];

    const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
    const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
    const ability = abilities[Math.floor(Math.random() * abilities.length)];
    const callSign = `${firstName} ${lastName} - ${ability}`;
    document.getElementById('callSignOutput').innerText = callSign;
}
</script>

<button onclick="generateCallSign()">Generate Call Sign</button>
<div id="callSignOutput"></div>
</body>
</html>
