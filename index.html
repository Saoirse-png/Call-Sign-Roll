<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Sign Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px 0; margin-right: 10px; }
        .result { margin-top: 20px; }
        h2 { color: #333; }
        .section { margin-top: 15px; padding: 10px; background-color: #f0f0f0; border-left: 4px solid #333; }
        .locations { border-left-color: #0066cc; background-color: #e8f4f8; }
    </style>
</head>
<body>
    <h1>Call Sign Generator</h1>
    <button id="generateWithName">Generate Call Sign + Name + Ability + Locations</button>
    <button id="exportBtn" style="display:none;">Export as Document</button>
    
    <div class="result">
        <h2 id="call-sign"></h2>
        <h2 id="name"></h2>
        <div id="ability" class="section" style="display:none;"></div>
        <div id="locations" class="section locations" style="display:none;"></div>
    </div>

    <script>
        const firstNames = ['Evelyn', 'Casey', 'Gael', 'Éibhleann', 'Morgan', 'Finn', 'Eriu', 'Orlaith', 'Cillian', 'Saoirse', 'Róisín', 'Lorcán', 'Caoimhe', 'Síofra', 'Niall', 'Rowan', 'Niamh', 'Seamus', 'Seánán', 'Eoghan', 'Tadhgán', 'Neala', 'Brian', 'Clodagh', 'Eithne', 'Seán', 'Faelwen', 'Maeve', 'Padraig', 'Kai', 'Diarmuid', 'Eamon', 'Luna', 'Ór', 'Colm'];
        
        const lastNames = ['McCarthy', 'Wild', 'Harper', 'Gallagher', 'Doyle', 'O\'Asissi', 'Murray', 'Byrne', 'Calendris', 'Tierney', 'O\'Thuaidh', 'Yeats'];

        const abilities = [
            { name: 'Radio Field', description: 'Once a week, learn a random callsign and immediately open a call, ignoring normal cooldowns' },
            { name: 'Beach Field', description: 'Once per week you may immediately arrive at a random coastal tile. Add beach to its name' },
            { name: 'Librarian', description: 'Once per week, choose a tile on the map, learn its name, and write a journal entry as though you had visited it (including viewing all previous journals)' },
            { name: 'Quantum Doppelganger', description: 'Once a week you can take 2 actions in a day. (quantum duplicates will vanish after one full day of existence)' },
            { name: 'Very loud', description: 'Once a week you may ask your ref to post a message in Island Broadcast. This message must be in all caps and contain a maximum of 10 characters (including spaces)' },
            { name: 'Summon field', description: 'Once a week while at your station, you may cause it to experience the effects of Artemis weather' },
            { name: 'Foresight', description: 'Once per week you may learn what the weather will be in your current tile 2 days in the future' }
        ];

        const gridReferences = ['A3', 'A4', 'A5', 'A6', 'A7', 'B2', 'B3', 'B4', 'B5', 'B6', 'C2', 'C3', 'C4', 'C5', 'D1', 'D2', 'D3', 'E1', 'E2', 'E3', 'F1', 'F2', 'F3', 'G1', 'G2', 'B7', 'B8', 'C6', 'C7', 'C8', 'C9', 'C10', 'D4', 'D5', 'D6', 'D7', 'D8', 'D9', 'D10', 'E4', 'E5', 'E9', 'E10', 'F4', 'F5', 'G3', 'G4', 'G5', 'H1', 'H2', 'H3', 'H4', 'I1', 'I2', 'I3', 'J1', 'J2', 'K1', 'E6', 'E7', 'E8', 'F6', 'F7', 'F8', 'F9', 'F10', 'G6', 'G7', 'G8', 'G9', 'G10', 'H5', 'H6', 'I4', 'I5', 'I6', 'J3', 'J4', 'J5', 'J6', 'K3', 'K4', 'K5', 'L4', 'D11', 'D12', 'D13', 'E11', 'E12', 'E13', 'E14', 'F11', 'F12', 'F13', 'F14', 'G11', 'G12', 'G13', 'G14', 'G15', 'G16', 'H11', 'H12', 'H13', 'H14', 'H15', 'H16', 'I11', 'I12', 'I13', 'I14', 'I15', 'I16', 'J11', 'J12', 'J13', 'J14', 'J15', 'J16', 'K11', 'K12', 'K13', 'K14', 'K15', 'L10', 'L11', 'L12', 'L13', 'L14', 'L15', 'M10', 'M11', 'M12', 'M13', 'M14', 'M15', 'N12', 'N13', 'N14', 'N15', 'N16', 'O13', 'O14', 'O15', 'O16', 'O17', 'P15', 'P16', 'P17', 'P18', 'P19', 'Q16', 'Q17', 'Q18', 'Q19', 'R16', 'R17', 'R18', 'R19', 'S16', 'S17', 'S18', 'S19', 'S20', 'T16', 'T17', 'T18', 'T19', 'T20', 'U17', 'U18', 'U19', 'H7', 'H8', 'H9', 'H10', 'I7', 'I8', 'I9', 'I10', 'J7', 'J8', 'J9', 'J10'];

        let currentData = {};

        function generateCallSign() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const numbers = '0123456789';
            let callSign = '';
            for (let i = 0; i < 3; i++) {
                callSign += letters.charAt(Math.floor(Math.random() * letters.length));
            }
            callSign += '-';
            for (let i = 0; i < 2; i++) {
                callSign += numbers.charAt(Math.floor(Math.random() * numbers.length));
            }
            return callSign;
        }

        function generateName() {
            const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            return `${firstName} ${lastName}`;
        }

        function generateAbility() {
            const ability = abilities[Math.floor(Math.random() * abilities.length)];
            return ability;
        }

        function generateLocations() {
            const locations = [];
            for (let i = 0; i < 3; i++) {
                const randomIndex = Math.floor(Math.random() * gridReferences.length);
                locations.push(gridReferences[randomIndex]);
            }
            return locations;
        }

        function exportDocument() {
            if (!currentData.callSign) {
                alert('Generate a character first!');
                return;
            }

            const docContent = `
CALL SIGN CHARACTER SHEET
=========================

Call Sign: ${currentData.callSign}
Name: ${currentData.name}

Ability: ${currentData.ability.name}
Description: ${currentData.ability.description}

Starting Locations: ${currentData.locations.join(', ')}

Generated: ${new Date().toLocaleString()}
            `.trim();

            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(docContent));
            element.setAttribute('download', `${currentData.name.replace(/ /g, '_')}_CallSign.txt`);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        document.getElementById('generateWithName').addEventListener('click', function() {
            const callSign = generateCallSign();
            const name = generateName();
            const ability = generateAbility();
            const locations = generateLocations();
            
            currentData = { callSign, name, ability, locations };
            
            document.getElementById('call-sign').innerText = 'Call Sign: ' + callSign;
            document.getElementById('name').innerText = 'Name: ' + name;
            
            const abilityDiv = document.getElementById('ability');
            abilityDiv.innerHTML = '<strong>' + ability.name + ':</strong> ' + ability.description;
            abilityDiv.style.display = 'block';

            const locationsDiv = document.getElementById('locations');
            locationsDiv.innerHTML = '<strong>Locations:</strong> ' + locations.join(', ');
            locationsDiv.style.display = 'block';

            document.getElementById('exportBtn').style.display = 'inline-block';
        });

        document.getElementById('exportBtn').addEventListener('click', exportDocument);
    </script>
</body>
</html>
