<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Sign Generator</title>
</head>
<body>
    <h1>Call Sign Generator</h1>
    <h2>Random Call Sign: <span id="callSign"></span></h2>
    <button onclick="generateCallSign()">Generate Call Sign</button>
    <script>
        const names = ['Falcon', 'Tiger', 'Shadow', 'Ghost', 'Fire'];
        const abilities = ['Agility', 'Strength', 'Stealth', 'Wisdom', 'Intelligence'];

        function generateCallSign() {
            const randomName = names[Math.floor(Math.random() * names.length)];
            const randomAbility = abilities[Math.floor(Math.random() * abilities.length)];
            document.getElementById('callSign').innerText = `${randomName} of ${randomAbility}`;
        }
    </script>
</body>
</html>
